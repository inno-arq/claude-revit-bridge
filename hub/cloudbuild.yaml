steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/revit-hub:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/revit-hub:latest', '.']
    dir: 'hub'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/revit-hub:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/revit-hub:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'revit-hub'
      - '--image=gcr.io/$PROJECT_ID/revit-hub:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=HUB_SECRET=${_HUB_SECRET}'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'

substitutions:
  _HUB_SECRET: ''

options:
  logging: CLOUD_LOGGING_ONLY
